frr defaults traditional
hostname R2-TRANSIT
log syslog informational
service integrated-vtysh-config
!
ipv6 forwarding
!
interface lo200
 ipv6 address 2001:db8:200::1/48
!
interface eth1
 ipv6 address 2001:db8:12::0/127
!
ipv6 prefix-list PL-TRANSIT-OUT seq 10 permit 2001:db8:200::/48
ipv6 prefix-list PL-TRANSIT-IN seq 10 permit 2001:db8:100::/48
!
route-map RM-ISP-OUT permit 10
 match ipv6 address prefix-list PL-TRANSIT-OUT
!
route-map RM-ISP-IN permit 10
 match ipv6 address prefix-list PL-TRANSIT-IN
!
router bgp 65002
 bgp router-id 2.2.2.2
 no bgp default ipv4-unicast
 neighbor 2001:db8:12::1 remote-as 65001
 !
 address-family ipv6 unicast
  neighbor 2001:db8:12::1 activate
  neighbor 2001:db8:12::1 route-map RM-ISP-IN in
  neighbor 2001:db8:12::1 route-map RM-ISP-OUT out
  network 2001:db8:200::/48
 exit-address-family
!
