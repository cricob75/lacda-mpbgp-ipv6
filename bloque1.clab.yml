name: bloque1-ebgpv6

topology:
  nodes:
    R1-ISP:
      kind: linux
      image: frrouting/frr:latest
      exec:
        - sed -i 's/bgpd=no/bgpd=yes/g' /etc/frr/daemons
        - /usr/lib/frr/frrinit.sh restart
        - ip link add lo100 type dummy
        - ip link set lo100 up
        - ip -6 addr add 2001:db8:100::1/48 dev lo100
        - ip -6 addr add 2001:db8:12::1/127 dev eth1

    R2-TRANSIT:
      kind: linux
      image: frrouting/frr:latest
      exec:
        - sed -i 's/bgpd=no/bgpd=yes/g' /etc/frr/daemons
        - /usr/lib/frr/frrinit.sh restart
        - ip link add lo200 type dummy
        - ip link set lo200 up
        - ip -6 addr add 2001:db8:200::1/48 dev lo200
        - ip -6 addr add 2001:db8:12::0/127 dev eth1
        - vtysh -c "conf t" -c "router bgp 65002" -c "bgp router-id 2.2.2.2" -c "no bgp default ipv4-unicast" -c "neighbor 2001:db8:12::1 remote-as 65001" -c "address-family ipv6 unicast" -c "neighbor 2001:db8:12::1 activate" -c "network 2001:db8:200::/48"

  links:
    - endpoints: ["R1-ISP:eth1", "R2-TRANSIT:eth1"]
