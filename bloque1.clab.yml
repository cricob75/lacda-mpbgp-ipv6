name: bloque1-ebgpv6

topology:
  nodes:
    R1-ISP:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/R1-ISP.conf:/etc/frr/frr.conf
      exec:
        - ip link add lo100 type dummy
        - ip link set lo100 up

    R2-TRANSIT:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/daemons:/etc/frr/daemons
        - configs/R2-TRANSIT.conf:/etc/frr/frr.conf
      exec:
        - ip link add lo200 type dummy
        - ip link set lo200 up

  links:
    - endpoints: ["R1-ISP:eth1", "R2-TRANSIT:eth1"]
